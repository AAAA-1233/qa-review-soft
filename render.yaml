services:
  - type: web
    name: qa-review-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: QA_DATA_DIR
        value: /tmp/qa-review-data
      - key: ALLOW_SERVER_PATH_IMPORT
        value: false
      - key: SEED_SAMPLE_DATA
        value: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TOKEN_EXPIRE_HOURS
        value: 168
      - key: AUTH_CODE_EXPIRE_MINUTES
        value: 10
      - key: AUTH_CODE_DEV_MODE
        value: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
